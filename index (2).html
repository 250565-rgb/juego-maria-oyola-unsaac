if(st==='trophy'){c.fillStyle='rgba(7,20,27,.9)';c.fillRect(0,0,W,H);confetti();trophy(W/2,400,Math.min(1,(T-trStart)*2.5));c.textAlign='center';c.fillStyle='#ffd166';c.font='bold 40px Georgia,serif';c.fillText('¡Semana '+(week-1)+' superada!',W/2,70);c.font='18px system-ui';c.fillStyle='#e6f6f8';c.fillText('Juana avanza a la semana '+week+'. ¡Sigue cuidándola!',W/2,104);const nw=WP.find(w=>w.w===week);if(nw)c.fillText('Nueva arma desbloqueada: '+nw.i+' '+nw.s,W/2,132);c.font='bold 17px system-ui';c.fillStyle='#ffd166';c.fillText('Toca o pulsa Enter para ver el camino de niveles',W/2,512)}
if(st==='menu')mapScreen();if(0)panel('Angela, guardiana de las 40 semanas',['Eres Angela, obstetra interna. Protege a Juana, embarazada.','Las infecciones y complicaciones del embarazo son zombis.','Cada zombi muestra su gravedad y la complicación que causa.','',"Toca los insumos que caen para juntarlos (como el sol).",'Elige un arma y toca al zombi al que quieres atacar.','Cada zombi solo muere con su medicamento correcto.','Juana tiene 3 vidas: si un zombi la alcanza, pierde una.','Cada zombi vencido da premio: más insumos, y cada 5 una vida extra.','Ganas armas nuevas cada semana. Llega a la semana 40.','',week>1?'Progreso guardado: semana '+week+' (N = nueva partida)':''],'Toca o pulsa Enter para empezar');
if(st==='intro'){const L=['Trimestre '+tri+' · Vidas: '+'♥'.repeat(lives),''],nw=WP.filter(w=>w.w===week),ne=TY.find(t=>t.w===week);
nw.forEach(w=>{L.push({t:'Arma ganada: '+w.i+' '+w.s,col:'#7cf5e4'},w.d,'')});
if(ne)L.push({t:'Nuevo enemigo: '+ne.n+' ('+SEV[ne.sev]+')',col:ne.col},'Complicación: '+ne.comp,'Tratamiento: '+WP[ne.cure].s,'');
if(week===40)L.push({t:'¡Jefe final: ECLAMPSIA MAYOR!',col:'#ff1744'},'Usa Sulfato Mg para vencerla.','');

// ---------- Lógica ----------
function setT(z,t){Object.assign(z,t,{need:t.boss?NEED[5]:NEED[t.sev]});z.hp=z.need;z.age=0}
function spawn(boss){const a=TY.filter(t=>t.w<=week&&(qk[t.n]||0)+Z.filter(q=>q.n===t.n).length<10);if(!boss&&!a.length)return;const t=boss?BOSS:a[Math.random()<.35?a.length-1:Math.floor(Math.random()*a.length)],side=Math.floor(Math.random()*3),z={x:side===0?-30:side===1?W+30:480,y:side===2?195:rnd(240,510),dir:1,ph:Math.random()*6,sel:0};setT(z,t);z.spd*=.55*(1+week*.006);Z.push(z);tone(90,.5,'sawtooth',.05,-30)}
function say(t,x,y,col){F.push({t,x,y,l:1.8,col})}
const need10=()=>TY.filter(t=>t.w<=week),quotaDone=()=>need10().every(t=>(qk[t.n]||0)>=10),prog=()=>{const a=need10();return a.reduce((s,t)=>s+Math.min(10,qk[t.n]||0),0)/(10*a.length)};
const SN={'Infección urinaria':'ITU','Corioamnionitis':'Corio','Preeclampsia':'Preecl.','Hemorragia':'Hemorr.','Diabetes gestacional':'Diabetes'};
function chips(){let x=20;c.font='bold 11px system-ui';c.textAlign='left';c.fillStyle='#0d3b4a';c.fillText('Meta:',x,174);x+=38;
need10().forEach(t=>{const k=Math.min(10,qk[t.n]||0),tx=(k>=10?'✔ ':'')+(SN[t.n]||t.n.split(' ')[0])+' '+k+'/10',w=c.measureText(tx).width+12;c.fillStyle='#0b1a22dd';rr(x,160,w,18,9);c.globalAlpha=.9;c.fillStyle=t.col;rr(x,160,Math.max(10,w*k/10),18,9);c.globalAlpha=1;c.strokeStyle='#000b';c.lineWidth=3;c.strokeText(tx,x+6,173);c.fillStyle='#fff';c.fillText(tx,x+6,173);x+=w+5})}
function kill(z){if(!z.boss)qk[z.n]=(qk[z.n]||0)+1;Z.splice(Z.indexOf(z),1);say(z.n+' controlada',z.x,z.y-140,'#0d6b4a');
const r=10+10*z.sev;ins+=r;kills++;say('Premio +'+r+' 💊',z.x,z.y-165,'#b8860b');
if(kills%5===0){if(lives<10){lives++;say('¡Premio especial: +1 vida para Juana!',J.x,J.y-170,'#d81b60')}else{ins+=60;say('¡Premio especial: +60 insumos!',J.x,J.y-170,'#d81b60')}jingle()}for(let i=0;i<12;i++)P.push({x:z.x,y:z.y-50,vx:rnd(-120,120),vy:rnd(-140,40),l:.5,col:z.col});tone(220,.25,'triangle',.1,300)}
function apply(s){const w=WP[s.w],z=s.z;if(!Z.includes(z))return;
for(let i=0;i<5;i++)P.push({x:z.x,y:z.y-60,vx:rnd(-80,80),vy:rnd(-80,40),l:.3,col:'#fff'});
if(s.w===4){slow=6;say('¡Enemigos frenados!',z.x,z.y-140,'#1f6fb8');return}
if(s.w===z.cure){tone(660,.2,'triangle',.12);kill(z)}
else{z.hp-=s.w===0?.5:.2;tone(150,.2,'sawtooth',.08);say('No es el indicado. Usa: '+WP[z.cure].s,z.x,z.y-140,'#b3261e');if(z.hp<=0)kill(z)}}
function use(z){tgt=z;if(!unl(sel)||wcd[sel]>0||ins<WP[sel].cost){tone(120,.15,'square',.08);say(!unl(sel)?'Arma aún no ganada':wcd[sel]>0?'Recargando…':'Faltan insumos',z.x,z.y-140,'#b3261e');return}
ins-=WP[sel].cost;wcd[sel]=WP[sel].cd;S.push({x:An.x,y:An.y-60,z,w:sel,t:0});An.tx=z.x+(z.x>J.x?60:-60);An.ty=z.y;An.dir=z.x>An.x?1:-1;tone(700,.1,'square',.05,300)}
function cesarea(){if(st!=='play'||ces||cesUsed||week<28)return;cesUsed=true;ces={t:3,final:false}}
function update(dt){if(st!=='play')return;tri=week<=13?1:week<=27?2:3;
if(ces){ces.t-=dt;if(ces.t<=0){Z=[];S=[];ces.final?victory():jingle();if(ces.final){st='end';try{localStorage.setItem('angSem',1)}catch(e){}}ces=null}return}
lt+=dt;J.hurt-=dt;slow=Math.max(0,slow-dt);wcd=wcd.map(x=>Math.max(0,x-dt*2.5));
const ax=An.tx-An.x,ay=An.ty-An.y,ad=Math.hypot(ax,ay);An.mv=ad>6?1:0;if(ad>6){An.x+=ax/ad*380*dt;An.y+=ay/ad*380*dt}
J.wt-=dt;if(J.wt<=0){J.wt=4;J.tx=rnd(480,640);J.ty=rnd(360,450);An.tx=J.x-80;An.ty=J.y+20}const jd=Math.hypot(J.tx-J.x,J.ty-J.y);if(jd>4){J.x+=(J.tx-J.x)/jd*20*dt;J.y+=(J.ty-J.y)/jd*20*dt}
dp-=dt;if(dp<=0){dp=2.4;K.push({x:rnd(60,900),py:150,ty:rnd(230,500),l:10})}
K.forEach(k=>{k.py=Math.min(k.ty,k.py+110*dt);k.l-=dt});K=K.filter(k=>k.l>0);
[0,1].forEach(i=>{nt[i]-=dt;if(nt[i]<=0&&K.length){nt[i]=5;const k=K.shift();ins+=25;say('+25 (enfermera)',k.x,k.py-20,'#0d6b4a');tone(900,.1,'sine',.08)}});
sp-=dt;if(sp<=0){sp=Math.max(1.2,2.4-week*.03);spawn()}if(week===40&&!bossSp&&quotaDone()){bossSp=1;spawn(true)}
const f=slow>0?.5:1;
[...Z].forEach(z=>{z.age+=dt;const ex=J.x-z.x,ey=J.y-z.y,d=Math.hypot(ex,ey);z.dir=ex>=0?1:-1;
if(z.ev!=null&&z.age>12&&TY[z.ev].w<=week+4){const n=TY[z.ev];setT(z,n);say('¡Se complicó: '+n.n+'!',z.x,z.y-150,'#b3261e');tone(100,.5,'sawtooth',.12,-40)}
if(d<36){Z.splice(Z.indexOf(z),1);if(J.hurt<=0){lives--;J.hurt=1.5;say('¡Juana perdió una vida!',J.x,J.y-150,'#b3261e');tone(160,.8,'sawtooth',.2,-100)}}else{z.x+=ex/d*z.spd*f*dt;z.y+=ey/d*z.spd*f*dt}});
S.forEach(s=>{s.t+=dt;if(s.t>=.3){apply(s);s.dead=1}});S=S.filter(s=>!s.dead);
P.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.l-=dt});P=P.filter(p=>p.l>0);F.forEach(q=>{q.y-=22*dt;q.l-=dt});F=F.filter(q=>q.l>0);
audio(dt);
if(lives<=0){st='over';return}
if(week<40&&quotaDone()){week++;maxWeek=Math.max(maxWeek,week);try{localStorage.setItem('angSem',week);localStorage.setItem('angMax',maxWeek)}catch(e){}Z=[];S=[];victory();trStart=T;st='trophy'}
else if(week===40&&bossSp&&!Z.some(z=>z.boss))ces={t:3.5,final:true}}
// ---------- Entrada ----------
function pt(e){const r=cv.getBoundingClientRect(),s=Math.min(r.width/W,r.height/H);return{x:(e.clientX-r.left-(r.width-W*s)/2)/s,y:(e.clientY-r.top-(r.height-H*s)/2)/s}}
function adv(){initA();if(st==='menu'){week=Math.min(maxWeek,40);st='intro'}else if(st==='trophy')st='menu';else if(st==='intro'){startLevel();st='play'}
else if(st==='over'){week=week<14?1:week<28?14:28;lives=10;cesUsed=false;st='intro'}else if(st==='end'){week=1;maxWeek=41;try{localStorage.setItem('angMax',41)}catch(e){}lives=10;cesUsed=false;st='menu'}}
cv.addEventListener('pointerdown',e=>{const p=pt(e);if(st==='menu'){mapClick(p);return}if(st!=='play'){adv();return}if(ces)return;
if(p.y>=70&&p.y<=154){const i=Math.floor((p.x-20)/80);if(i>=0&&i<WP.length&&p.x-20-i*80<74){sel=i;tone(500,.06);return}}
if(week>=28&&!cesUsed&&Math.hypot(p.x-900,p.y-480)<42){cesarea();return}
const k=K.findIndex(q=>Math.hypot(q.x-p.x,q.py-p.y)<34);if(k>=0){const q=K.splice(k,1)[0];ins+=25;say('+25',q.x,q.py-20,'#0d6b4a');tone(900,.1,'sine',.1);return}
let best=null,bd=1e9;Z.forEach(z=>{const s=(.6+.55*z.y/H)*(z.boss?1.7:1),dx=Math.abs(p.x-z.x),dy=p.y-(z.y-60*s);if(dx<34*s&&p.y>z.y-150*s&&p.y<z.y+15){const d=dx+Math.abs(dy);if(d<bd){bd=d;best=z}}});
if(best)use(best)});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k===' '||k.startsWith('arrow'))e.preventDefault();
if(k==='enter'||(k===' '&&st!=='play'))adv();else if(k>='1'&&k<='9'&&st==='play')sel=+k-1;else if(k==='c')cesarea();
else if(k==='m'){mute=!mute;if(amb)amb.gain.value=mute?0:.05}else if(k==='n'&&st==='menu'){week=1;maxWeek=1;lives=10;cesUsed=false;try{localStorage.setItem('angMax',1)}catch(e){}try{localStorage.setItem('angSem',1)}catch(e){}}});
let last=0;function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000||0);last=t;T+=dt;update(dt);draw()}requestAnimationFrame(loop);
